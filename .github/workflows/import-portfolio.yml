name: One-time final portfolio import
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-portfolio.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and replace portfolio files
        run: python scripts/import-public-portfolio.py
      - name: Save final files and remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Replace previous portfolio with verified final version"
            git push origin HEAD:main
          fi
